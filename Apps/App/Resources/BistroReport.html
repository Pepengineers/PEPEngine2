<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/png">
<title>Benchmark results · PEPEngine2</title>
<style>
:root {
  --ink:#101b19; --panel:#192b25; --border:#384d43; --paper:#f3f4ea;
  --muted:#b2c4b9; --lime:#b9ef7b; --mint:#66dbb2; --button:#283e35;
  font: 17px/1.5 "Segoe UI", system-ui, sans-serif; color:var(--paper); background:var(--ink);
}
* { box-sizing:border-box }
body { max-width:1120px; margin:0 auto; padding:0 24px 48px }
.brand { display:flex; align-items:center; gap:16px; padding:22px 2px; color:var(--muted) }
.brand b { font-size:1.18rem; color:var(--paper); border-right:1px solid var(--border); padding-right:16px }
.brand img { width:40px; height:40px; margin-right:-8px }
main { background:var(--panel); border:1px solid var(--border); border-radius:7px; padding:clamp(18px,4vw,44px) }
header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap }
h1 { margin:0; font-size:clamp(2rem,4vw,3.25rem); font-weight:600; line-height:1.12; letter-spacing:-.035em }
header p { margin:8px 0 0 }
h2 { display:flex; align-items:center; gap:14px; font-weight:600; font-size:1.28rem; margin:1.7em 0 .7em }
h2::after { content:""; height:1px; flex:1; background:var(--border) }
h3 { font-size:1rem; font-weight:600 }
p { margin:.55em 0; overflow-wrap:anywhere }
.muted, figcaption, small { color:var(--muted) }
nav { margin-top:22px }
nav > span { display:block; margin-bottom:6px }
button, .action { font:inherit; color:var(--paper); border:none; border-radius:4px; padding:7px 13px; background:var(--button); cursor:pointer; text-decoration:none }
button:hover, .action:hover, summary:hover { background:#385648 }
button:focus-visible, a:focus-visible, summary:focus-visible { outline:2px solid var(--lime); outline-offset:3px }
.switch { display:inline-flex; gap:1px; background:var(--ink); border-radius:4px; overflow:hidden }
.switch button { border-radius:0; background:#121f1b }
.switch button[aria-pressed="true"] { background:#416853; box-shadow:inset 0 -3px var(--lime) }
.context { margin:1.2em 0 1em; font-size:1.1rem }
.status { color:var(--muted); display:inline-block; margin-left:.6em }
.metrics { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin:0 0 .8em }
.metric { border:1px solid var(--border); border-radius:5px; padding:clamp(12px,2vw,24px) }
.metric dd { font-size:clamp(2.3rem,5.5vw,4rem); font-weight:600; margin:.24em 0 0; color:var(--lime); line-height:1.12; letter-spacing:-.04em }
.metric dd small { font-size:1rem; font-weight:400; letter-spacing:0; margin-left:.35em }
strong { font-weight:600 }
details { margin-top:8px; border:1px solid var(--border); border-radius:5px; overflow:hidden }
summary { cursor:pointer; padding:.65em .9em; background:#20322b }
summary small { margin-left:.55em; font-variant-numeric:tabular-nums }
details > h3 { margin:1em }
.scroll { overflow-x:auto }
table { border-collapse:collapse; width:100%; font-size:.92rem }
th, td { text-align:left; vertical-align:top; padding:.48em 1em; border-top:1px solid var(--border); overflow-wrap:anywhere }
th { font-weight:500 }
thead { color:var(--muted); background:#16251f }
.filter { margin:.6em 1em }
.changes-only tr.same, details:not(.changes-only) > .no-changes { display:none }
.no-changes { margin:.5em 1em }
.delta { margin-left:.4em; color:#a8cfeb; font-size:.9em; font-weight:600 }
.delta.Raised { color:var(--mint) }
.delta.Reduced { color:#f8c36e }
figure { margin:1em 0; padding:16px; border:1px solid var(--border); border-radius:5px; background:var(--ink) }
.plot-controls { --control-height:2.2rem; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px;
  align-items:start; position:relative; z-index:1; font-size:.88rem }
.plot-tools, .plot-zoom, .plot-pan { display:flex; gap:6px; align-items:center }
.plot-tools { flex-wrap:wrap }
.plot-zoom[hidden], .plot-pan[hidden], .plot-title { display:none }
.plot-controls .switch { flex:none }
.plot-controls .switch button { height:var(--control-height); padding-block:0 }
.chart-icon { position:relative; display:grid; place-items:center; height:var(--control-height);
  width:2.2rem; padding:0; color:var(--lime) }
.chart-icon:disabled { opacity:.38; cursor:default }
.chart-icon:not(:disabled):is(:hover,:focus-visible)::after { content:attr(aria-label); white-space:nowrap;
  position:absolute; top:calc(100% + 4px); left:50%; translate:-50% 0;
  padding:2px 6px; background:var(--panel); color:var(--paper); border:1px solid var(--border); border-radius:4px }
.chart-icon.expand-chart:not(:disabled):is(:hover,:focus-visible)::after { left:auto; right:0; translate:none }
.expand-chart::before {
  content:""; width:16px; height:16px;
  background:
    linear-gradient(90deg,currentColor 5px,transparent 5px 11px,currentColor 11px) top / 100% 2px no-repeat,
    linear-gradient(90deg,currentColor 5px,transparent 5px 11px,currentColor 11px) bottom / 100% 2px no-repeat,
    linear-gradient(currentColor 5px,transparent 5px 11px,currentColor 11px) left / 2px 100% no-repeat,
    linear-gradient(currentColor 5px,transparent 5px 11px,currentColor 11px) right / 2px 100% no-repeat;
}
.expand-chart[aria-expanded="true"]::before { content:"×"; background:none; font-size:22px; line-height:16px; text-align:center }
.zoom-button span { width:13px; height:13px; display:grid; place-items:center; border:1.7px solid;
  border-radius:50%; position:relative; transform:translate(-2px,-2px) }
.zoom-button span::before { content:""; width:6px; height:1.6px; background:currentColor }
.zoom-button.plus span { background:linear-gradient(currentColor,currentColor) center / 1.6px 6px no-repeat }
.zoom-button span::after { content:""; width:6px; height:1.7px; background:currentColor;
  position:absolute; top:calc(100% - 1px); left:calc(100% - 1px); transform:rotate(45deg); transform-origin:left center }
.reset-chart span { width:15px; height:15px; position:relative; border:1.7px solid; border-top-color:transparent; border-radius:50% }
.reset-chart span::before { content:""; position:absolute; top:-2px; left:-1px; width:5px; height:5px;
  border-top:1.7px solid; border-right:1.7px solid; rotate:12deg }
.help-chart span { width:17px; height:17px; border:1.7px solid; border-radius:50%; font-weight:600; font-size:12px; line-height:14px }
.pan-earlier::before, .pan-later::before { content:""; width:8px; height:8px; border-top:1.7px solid; border-left:1.7px solid; rotate:-45deg }
.pan-later::before { rotate:135deg }
.plot-help { position:absolute; z-index:2; inset:calc(100% + 5px) 0 auto auto; max-width:100%;
  padding:10px 14px; border:1px solid var(--border); border-radius:5px; background:var(--panel); color:var(--paper) }
.plot-help ul { margin:.35em 0 0; padding-inline-start:1.3em }
.plot-dialog { color:inherit; background:var(--ink); padding:0; border:1px solid var(--border); border-radius:7px;
  width:calc(100% - 24px); max-width:none; height:calc(100% - 24px); max-height:none }
.plot-dialog::backdrop { background:#000b }
.plot-dialog figure { display:grid; grid-template-rows:auto minmax(90px,1fr) auto auto; row-gap:4px;
  height:100%; margin:0; border:none }
.plot-dialog .plot-controls { position:sticky; top:0; background:var(--ink) }
@media (min-width:780px) {
  .plot-dialog .plot-title { display:block; margin-inline-end:.5em }
}
body:has(.plot-dialog[open]) { overflow:hidden }
.plot-legend { display:flex; flex-wrap:wrap; align-items:center; gap:.25em 1.1em }
.series, .target-key { display:flex; align-items:center; gap:.45em }
.series::before, .target-key::before { content:""; flex:none; width:1.6em; border-top:2px solid var(--mint) }
.series.second::before { border-top:2px dashed #f8c36e }
.target-key::before { border-top:2px dashed var(--muted) }
figure svg { cursor:crosshair; touch-action:pan-y; height:clamp(150px,22vw,245px) }
.plot-dialog svg { height:100%; min-height:0; margin:0; touch-action:none }
figure svg:focus-visible { outline:1px solid var(--lime) }
.frame-readout { margin-top:.55em; padding-top:.45em; border-top:1px solid var(--border); font-size:.86rem; font-variant-numeric:tabular-nums }
.frame-values { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,8.5rem),1fr)); gap:.25em .75em; margin:0 0 .35em }
.frame-values div { display:flex; align-items:baseline; gap:.55em }
.frame-values dt, .frame-note { color:var(--muted) }
.frame-values dd { margin:0; white-space:nowrap }
.frame-values .first dt { color:var(--mint) }
.frame-values .second dt { color:#f8c36e }
.frame-actions { display:flex; flex-wrap:wrap; gap:.3em .8em; align-items:baseline }
.frame-note { margin:0 }
.frame-details { flex:none; margin:0 }
.frame-details[open] { flex-basis:100% }
.frame-details summary { padding:.12em .65em }
.frame-unpin { padding:.12em .65em }
.frame-unpin:disabled { opacity:.38; cursor:default }
.frame-samples { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr)); gap:.4em 1em; padding:.4em .65em }
.frame-samples p { margin:0 }
svg polyline.second { stroke:#f8c36e; stroke-dasharray:6 4 }
svg .cursor { stroke:var(--paper); stroke-dasharray:2 3 }
svg circle { fill:var(--mint); stroke:var(--ink) }
svg circle.second { fill:#f8c36e }
svg { width:100%; display:block; margin:.5em 0 }
svg text { fill:var(--muted); font-size:12px; font-variant-numeric:tabular-nums }
svg .zoom-box { fill:#66dbb238; stroke:var(--mint) }
svg line { stroke:var(--border) }
svg .target { stroke:var(--muted); stroke-dasharray:6 5 }
svg polyline { fill:none; stroke:var(--mint); stroke-width:1.6; vector-effect:non-scaling-stroke }
.route-axis { font-size:.85rem; color:var(--muted); text-align:center }
figcaption { margin-top:.6em; font-size:.92rem }
.files { list-style:none; padding:0 1em; line-height:1.8; overflow-wrap:anywhere }
.files a { color:var(--mint) }
@media (max-width:600px) {
  body { padding:0 10px 20px } main { padding:16px }
  .metrics { grid-template-columns:1fr }
  .metric { display:flex; align-items:baseline; justify-content:space-between; gap:8px }
  .metric dd { font-size:2.2rem; margin:0 }
  .brand { padding:14px 2px }
  figure { padding:8px }
}
</style>
</head>
<body>
<div class="brand"><img src="@@ENGINE_ICON@@" alt=""><b>Pepengine2</b> Benchmark results</div>
<main>
<!--BENCHMARK-->
</main>
<script>
"use strict";
const views = document.querySelectorAll("button[data-view]");
for (const tab of views) {
  tab.onclick = () => {
    for (const button of views) {
      const active = button === tab;
      button.setAttribute("aria-pressed", String(active));
      document.getElementById(button.dataset.view).hidden = !active;
    }
  };
}
document.querySelector('a[href="#sources"]').onclick = () => { document.getElementById("sources").open = true; };
document.title = document.querySelector("h1").textContent + " · Benchmark results · PEPEngine2";

document.querySelector('link[rel="icon"]').href = document.querySelector(".brand img").src;
for (const filter of document.querySelectorAll(".filter")) {
  const buttons = [...filter.querySelectorAll("button")];
  buttons.forEach((button, index) => button.onclick = () => {
    filter.closest("details").classList.toggle("changes-only", index === 0);
    buttons.forEach(b => b.setAttribute("aria-pressed", String(b === button)));
  });
}

for (const [chartIndex, chart] of [...document.querySelectorAll("figure[data-target]")].entries()) {
  const svg = chart.querySelector("svg");
  if (!svg) continue;
  const lines = [...chart.querySelectorAll(".series")].map(el => {
    const sections = [];
    const label = el.querySelector(".series-label");
    for (const section of el.querySelectorAll("[data-section]")) sections[Number(section.dataset.section)] = section.textContent;
    return {
      frames: el.dataset.frames.trim().split(/\s+/).map(row => row.split(",").map(Number)),
      trace: el.dataset.trace.trim().split(/\s+/).map(Number),
      role: el.classList.contains("second") ? "second" : "first",
      label, msCaption: label.textContent, sections
    };
  });
  const start = Math.min(...lines.map(l => l.frames[0][0]));
  const duration = Math.max(.001, Math.max(...lines.map(l => l.frames.at(-1)[0])) - start);
  const limit = Number(chart.dataset.target);
  const buttons = [...chart.querySelectorAll(".switch button")];
  const expand = chart.querySelector(".expand-chart");
  const toolbar = chart.querySelector(".plot-zoom");
  const pan = chart.querySelector(".plot-pan");
  const help = chart.querySelector(".plot-help");
  const helpButton = chart.querySelector(".help-chart");
  const readout = chart.querySelector(".frame-values");
  const details = chart.querySelector(".frame-details");
  const unpin = chart.querySelector(".frame-unpin");
  const samples = chart.querySelector(".frame-samples");
  const pair = lines.length === 2;
  const comparable = chart.dataset.comparable === "true";
  const chartTitle = chart.querySelector(".plot-title").textContent;
  const dialog = document.createElement("dialog");
  dialog.className = "plot-dialog";
  dialog.setAttribute("aria-label", chartTitle);
  chart.after(dialog);
  const xAxis = [0, 1], yAxis = [0, 1];
  const clipId = "plot-clip-" + chartIndex;
  const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
  let fps = false, pinned = false, cursorTime = null, markers, selection, drag;
  let inspected = [];
  let left, right, bottom, begin, end, low, range;
  const top = 12;
  const fullPeak = [false, true].map(rate => {
    let peak = limit ? (rate ? limit : 1000 / limit) : 0;
    for (const line of lines)
      for (const index of line.trace)
        peak = Math.max(peak, rate ? 1000 / line.frames[index][1] : line.frames[index][1]);
    return peak;
  });
  const value = frame => fps ? 1000 / frame[1] : frame[1];
  const x = time => left + (right - left) * (time - begin) / (end - begin);
  const y = value => bottom - (bottom - top) * (value - low) / range;
  const xFraction = px => clamp((px - left) / (right - left), 0, 1);
  const yFraction = px => clamp((bottom - px) / (bottom - top), 0, 1);
  const timeAt = px => begin + (end - begin) * xFraction(px);

  function field(label, role = "") {
    const cell = document.createElement("div");
    const term = document.createElement("dt");
    const result = document.createElement("dd");
    cell.className = role;
    term.textContent = label;
    result.textContent = "—";
    cell.append(term, result);
    readout.append(cell);
    return {term, result};
  }
  const routeField = field("Route");
  const lineFields = lines.map((line, i) => field(pair ? (i === 0 ? "A" : "B") : "Interval", line.role));
  const deltaField = pair ? field("B − A") : null;

  function setPinned(state) {
    pinned = state;
    routeField.term.textContent = pinned ? "Pinned" : "Route";
    unpin.disabled = !pinned;
  }
  function setAxis(axis, min, max) {
    const span = clamp(max - min, .000001, 1);
    axis[0] = clamp(min, 0, 1 - span);
    axis[1] = axis[0] + span;
  }
  function zoomAxis(axis, anchor, factor) {
    const span = axis[1] - axis[0];
    const size = clamp(span * factor, .000001, 1);
    const min = axis[0] + anchor * (span - size);
    setAxis(axis, min, min + size);
  }
  function zoom(factor, fx = .5, fy = .5) {
    zoomAxis(xAxis, fx, factor);
    zoomAxis(yAxis, fy, factor);
    draw();
  }
  function reset() {
    setAxis(xAxis, 0, 1);
    setAxis(yAxis, 0, 1);
    setPinned(false);
    details.open = false;
    draw();
  }
  function fitY() {
    setAxis(yAxis, 0, 1);
    if (xAxis[0] === 0 && xAxis[1] === 1) return;
    const peak = fullPeak[Number(fps)];
    const first = start + duration * xAxis[0], last = start + duration * xAxis[1];
    let min = peak, max = 0;
    for (const {frames} of lines) {
      for (let i = lowerBound(frames, first); i < frames.length && frames[i][0] <= last; ++i) {
        const sample = value(frames[i]);
        min = Math.min(min, sample);
        max = Math.max(max, sample);
      }
    }
    if (max > 0) {
      const pad = Math.max(.05 * (max - min), .03 * max);
      setAxis(yAxis, Math.max(0, (min - pad) / peak), Math.min(1, (max + pad) / peak));
    }
  }
  function node(name, attrs, parent = svg) {
    const el = document.createElementNS("http://www.w3.org/2000/svg", name);
    for (const [key, val] of Object.entries(attrs)) el.setAttribute(key, val);
    parent.append(el);
    return el;
  }
  function lowerBound(frames, t) {
    let lo = 0, hi = frames.length;
    while (lo < hi) {
      const mid = Math.floor((lo + hi) / 2);
      if (frames[mid][0] < t) lo = mid + 1; else hi = mid;
    }
    return lo;
  }
  function nearest(frames, t) {
    const i = lowerBound(frames, t);
    return i === frames.length || (i && t - frames[i - 1][0] < frames[i][0] - t) ? i - 1 : i;
  }
  function visibleTrace(line) {
    if (!dialog.open) return line.trace;
    const {frames} = line;
    const points = [];
    let i = lowerBound(frames, begin);
    if (i) points.push(i - 1);
    while (i < frames.length && frames[i][0] <= end) {
      let min = i, max = i;
      const column = Math.floor(x(frames[i++][0]));
      for (; i < frames.length && frames[i][0] <= end && Math.floor(x(frames[i][0])) === column; ++i) {
        if (frames[i][1] < frames[min][1]) min = i;
        if (frames[i][1] > frames[max][1]) max = i;
      }
      points.push(Math.min(min, max));
      if (min !== max) points.push(Math.max(min, max));
    }
    if (i < frames.length) points.push(i);
    return points;
  }
  function renderDetails() {
    if (!details.open) return;
    samples.replaceChildren();
    for (const [i, frame] of inspected.entries()) {
      const block = document.createElement("div");
      const title = document.createElement("strong");
      const extra = document.createElement("p");
      const source = pair ? (i === 0 ? "A · " : "B · ") : "";
      if (frame) {
        const [time, interval, cpu, number, section] = frame;
        title.textContent = source + "Frame #" + number + " · " + time.toFixed(3) + " s";
        const context = [lines[i].sections[section], "Interval " + interval.toFixed(3) + " ms"];
        if (cpu >= 0) context.push("CPU scope " + cpu.toFixed(3) + " ms");
        extra.textContent = context.filter(Boolean).join(" · ");
      } else {
        title.textContent = source + "Outside measured interval";
      }
      block.append(title, extra);
      samples.append(block);
    }
  }
  function inspect(t) {
    cursorTime = pinned ? t : clamp(t, begin, end);
    markers.replaceChildren();
    const showMarkers = cursorTime >= begin && cursorTime <= end;
    if (showMarkers) node("line", {class:"cursor", x1:x(cursorTime), x2:x(cursorTime), y1:top, y2:bottom}, markers);
    const unit = fps ? " FPS" : " ms";
    routeField.result.textContent = cursorTime.toFixed(3) + " s";
    inspected = lines.map((line, i) => {
      const frame = cursorTime < line.frames[0][0] || cursorTime > line.frames.at(-1)[0] ?
        null : line.frames[nearest(line.frames, cursorTime)];
      if (!pair) lineFields[i].term.textContent = fps ? "Rate" : "Interval";
      if (frame) {
        lineFields[i].result.textContent = value(frame).toFixed(3) + unit;
        if (showMarkers) node("circle", {class:line.role, cx:x(frame[0]), cy:y(value(frame)), r:4}, markers);
      } else {
        lineFields[i].result.textContent = "—";
      }
      return frame;
    });
    if (deltaField) {
      const delta = comparable && inspected.every(Boolean) ? value(inspected[1]) - value(inspected[0]) : null;
      deltaField.result.textContent = delta === null ? "—" : (delta >= 0 ? "+" : "") + delta.toFixed(3) + unit;
    }
    if (pinned) renderDetails();
  }
  function draw() {
    if (!svg.clientWidth || !svg.clientHeight) return;
    const target = limit && (fps ? limit : 1000 / limit);
    const peak = fullPeak[Number(fps)];
    begin = start + duration * xAxis[0];
    end = start + duration * xAxis[1];
    low = peak * yAxis[0];
    range = peak * (yAxis[1] - yAxis[0]);
    const decimals = span => clamp(Math.ceil(-Math.log10(span / 4)) + 1, 1, 5);
    left = dialog.open ? 73 : 54;
    right = Math.max(left + 1, svg.clientWidth - (dialog.open ? 38 : 22));
    bottom = Math.max(top + 1, svg.clientHeight - 24);
    svg.replaceChildren();
    const ticks = Math.max(2, Math.min(dialog.open ? 8 : 4, Math.floor((right - left) / 78)));
    for (let i = 0; i <= ticks; ++i) {
      const time = begin + (end - begin) * i / ticks;
      node("line", {x1:x(time), x2:x(time), y1:top, y2:bottom});
      node("text", {x:x(time), y:bottom + 18, "text-anchor":"middle"}).textContent = time.toFixed(decimals(end - begin));
    }
    for (let i = 0; i <= 4; ++i) {
      const tick = low + range * i / 4;
      node("line", {x1:left, x2:right, y1:y(tick), y2:y(tick)});
      node("text", {x:left - 8, y:y(tick) + 4, "text-anchor":"end"}).textContent = tick.toFixed(decimals(range));
    }
    const clip = node("clipPath", {id:clipId});
    node("rect", {x:left, y:top, width:right - left, height:bottom - top}, clip);
    const bounds = node("g", {"clip-path":"url(#" + clipId + ")"});
    if (target) {
      if (target >= low && target <= low + range)
        node("line", {class:"target", x1:left, x2:right, y1:y(target), y2:y(target)}, bounds);
      chart.querySelector(".target-key").textContent = "Target " + (fps ? limit + " FPS" : target.toFixed(1) + " ms");
    }
    for (const line of lines) {
      line.label.textContent = fps ? line.label.dataset.fps : line.msCaption;
      const points = visibleTrace(line).map(index => {
        const frame = line.frames[index];
        return x(frame[0]) + "," + y(value(frame));
      });
      if (points.length === 1) {
        const [cx, cy] = points[0].split(",");
        node("circle", {class:line.role, cx, cy, r:2}, bounds);
      } else if (points.length) {
        node("polyline", {class:line.role, points:points.join(" ")}, bounds);
      }
    }
    markers = node("g", {}, bounds);
    selection = node("rect", {class:"zoom-box", width:0, height:0, visibility:"hidden"}, bounds);
    inspect(cursorTime ?? (begin + end) / 2);
    buttons.forEach((button, i) => button.setAttribute("aria-pressed", String(Boolean(i) === fps)));
    pan.firstElementChild.disabled = xAxis[0] <= 0;
    pan.lastElementChild.disabled = xAxis[1] >= 1 - 1e-9;
  }
  function position(event) {
    const rect = svg.getBoundingClientRect();
    return {x:event.clientX - rect.left, y:event.clientY - rect.top};
  }
  const inside = p => p.x >= left && p.x <= right && p.y >= top && p.y <= bottom;
  svg.onpointerdown = event => {
    if (drag) return;
    const p = position(event);
    if (!inside(p) || (event.button !== 0 && event.button !== 2)) return;
    if (!dialog.open) {
      if (event.button === 0) {
        setPinned(true);
        inspect(timeAt(p.x));
      }
      return;
    }
    drag = {...p, id:event.pointerId, pan:event.button === 2 || event.shiftKey};
    svg.setPointerCapture(event.pointerId);
    svg.focus({preventScroll:true});
  };
  svg.onpointermove = event => {
    const p = position(event);
    if (!drag) {
      if (!pinned && (!dialog.open || inside(p))) inspect(timeAt(p.x));
      return;
    }
    if (drag.id !== event.pointerId) return;
    if (drag.pan) {
      const dx = (drag.x - p.x) / (right - left) * (xAxis[1] - xAxis[0]);
      const dy = (p.y - drag.y) / (bottom - top) * (yAxis[1] - yAxis[0]);
      setAxis(xAxis, xAxis[0] + dx, xAxis[1] + dx);
      setAxis(yAxis, yAxis[0] + dy, yAxis[1] + dy);
      drag.x = p.x;
      drag.y = p.y;
      draw();
    } else {
      selection.setAttribute("x", Math.min(p.x, drag.x));
      selection.setAttribute("y", Math.min(p.y, drag.y));
      selection.setAttribute("width", Math.abs(p.x - drag.x));
      selection.setAttribute("height", Math.abs(p.y - drag.y));
      selection.setAttribute("visibility", "visible");
    }
  };
  svg.onpointerup = event => {
    if (drag?.id !== event.pointerId) return;
    const p = position(event);
    const select = (axis, a, b) => {
      const span = axis[1] - axis[0];
      setAxis(axis, axis[0] + Math.min(a, b) * span, axis[0] + Math.max(a, b) * span);
    };
    const zoomX = !drag.pan && Math.abs(drag.x - p.x) > 5;
    const zoomY = !drag.pan && Math.abs(drag.y - p.y) > 5;
    if (zoomX) select(xAxis, xFraction(drag.x), xFraction(p.x));
    if (zoomY) select(yAxis, yFraction(drag.y), yFraction(p.y));
    const click = !drag.pan && !zoomX && !zoomY;
    drag = null;
    if (zoomX || zoomY) {
      draw();
    }
    if (click) setPinned(true);
    if (click || !pinned) inspect(timeAt(p.x));
  };
  svg.onlostpointercapture = () => {
    drag = null;
    selection?.setAttribute("visibility", "hidden");
  };
  svg.oncontextmenu = event => { if (dialog.open) event.preventDefault(); };
  svg.ondblclick = () => { if (dialog.open) reset(); };
  svg.addEventListener("wheel", event => {
    if (!dialog.open || event.ctrlKey) return;
    const p = position(event);
    if (!inside(p)) return;
    event.preventDefault();
    if (!drag && event.deltaY) zoom(event.deltaY < 0 ? .8 : 1.25, xFraction(p.x), yFraction(p.y));
  }, {passive:false});
  // Advance at least one displayed frame, even when the pointer is between samples.
  svg.onkeydown = event => {
    if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
    event.preventDefault();
    if (event.key === "End") { inspect(end); return; }
    if (event.key === "Home" || cursorTime === null) { inspect(begin); return; }
    const right = event.key === "ArrowRight";
    let next = right ? end : begin;
    for (const {frames} of lines) {
      let i = nearest(frames, cursorTime) + (right ? 1 : -1);
      if (right && cursorTime < frames[0][0]) i = 0;
      if (!right && cursorTime > frames.at(-1)[0]) i = frames.length - 1;
      while (i >= 0 && i < frames.length && (right ? frames[i][0] <= cursorTime : frames[i][0] >= cursorTime))
        i += right ? 1 : -1;
      if (i >= 0 && i < frames.length) next = right ? Math.min(next, frames[i][0]) : Math.max(next, frames[i][0]);
    }
    inspect(clamp(next, begin, end));
  };
  buttons.forEach((button, i) => button.onclick = () => {
    if (fps === Boolean(i)) return;
    fps = Boolean(i);
    drag = null;
    fitY();
    draw();
  });
  for (const button of toolbar.querySelectorAll("[data-scale]")) {
    const factor = Number(button.dataset.scale);
    button.onclick = () => {
      if (factor === 1) { reset(); return; }
      zoomAxis(xAxis, .5, factor);
      fitY();
      draw();
    };
  }
  for (const button of pan.querySelectorAll("button")) {
    button.onclick = () => {
      const step = Number(button.dataset.pan) * (xAxis[1] - xAxis[0]);
      setAxis(xAxis, xAxis[0] + step, xAxis[1] + step);
      fitY();
      draw();
    };
  }
  function setHelp(open) {
    help.hidden = !open;
    helpButton.setAttribute("aria-expanded", String(open));
  }
  helpButton.onclick = () => setHelp(help.hidden);
  details.ontoggle = () => {
    if (details.open) {
      setPinned(true);
      renderDetails();
    }
  };
  unpin.onclick = () => {
    setPinned(false);
    details.open = false;
  };
  expand.onclick = () => {
    if (dialog.open) { dialog.close(); return; }
    dialog.append(chart);
    toolbar.hidden = pan.hidden = false;
    expand.setAttribute("aria-label", "Close chart");
    expand.setAttribute("aria-expanded", "true");
    dialog.showModal();
    expand.focus();
    reset();
  };
  dialog.oncancel = event => {
    if (help.hidden) return;
    event.preventDefault();
    setHelp(false);
    helpButton.focus();
  };
  dialog.onclose = () => {
    dialog.before(chart);
    toolbar.hidden = pan.hidden = true;
    setHelp(false);
    details.open = false;
    expand.setAttribute("aria-label", "Expand chart");
    expand.setAttribute("aria-expanded", "false");
    drag = null;
    expand.focus({preventScroll:true});
    reset();
  };
  new ResizeObserver(draw).observe(svg);
  draw();
}
</script>
</body>
</html>
