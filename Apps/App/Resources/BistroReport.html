<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/png">
<title>Benchmark results · PEPEngine2</title>
<style>
:root {
  --ink:#101b19; --panel:#192b25; --border:#384d43; --paper:#f3f4ea;
  --muted:#b2c4b9; --lime:#b9ef7b; --mint:#66dbb2; --button:#283e35;
  font: 17px/1.5 "Segoe UI", system-ui, sans-serif; color:var(--paper); background:var(--ink);
}
* { box-sizing:border-box }
body { max-width:1120px; margin:0 auto; padding:0 24px 48px }
.brand { display:flex; align-items:center; gap:16px; padding:22px 2px; color:var(--muted) }
.brand b { font-size:1.18rem; color:var(--paper); border-right:1px solid var(--border); padding-right:16px }
.brand img { width:40px; height:40px; margin-right:-8px }
main { background:var(--panel); border:1px solid var(--border); border-radius:7px; padding:clamp(18px,4vw,44px) }
header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; flex-wrap:wrap }
h1 { margin:0; font-size:clamp(2rem,4vw,3.25rem); font-weight:600; line-height:1.12; letter-spacing:-.035em }
header p { margin:8px 0 0 }
h2 { display:flex; align-items:center; gap:14px; font-weight:600; font-size:1.28rem; margin:1.7em 0 .7em }
h2::after { content:""; height:1px; flex:1; background:var(--border) }
h3 { font-size:1rem; font-weight:600 }
p { margin:.55em 0; overflow-wrap:anywhere }
.muted, figcaption, small { color:var(--muted) }
nav { margin-top:22px }
nav > span { display:block; margin-bottom:6px }
button, .action { font:inherit; color:var(--paper); border:none; border-radius:4px; padding:7px 13px; background:var(--button); cursor:pointer; text-decoration:none }
button:hover, .action:hover, summary:hover { background:#385648 }
button:focus-visible, a:focus-visible, summary:focus-visible { outline:2px solid var(--lime); outline-offset:3px }
.switch { display:inline-flex; gap:1px; background:var(--ink); border-radius:4px; overflow:hidden }
.switch button { border-radius:0; background:#121f1b }
.switch button[aria-pressed="true"] { background:#416853; box-shadow:inset 0 -3px var(--lime) }
.context { margin:1.2em 0 1em; font-size:1.1rem }
.status { color:var(--muted); display:inline-block; margin-left:.6em }
.metrics { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin:0 0 .8em }
.metric { border:1px solid var(--border); border-radius:5px; padding:clamp(12px,2vw,24px) }
.metric dd { font-size:clamp(2.3rem,5.5vw,4rem); font-weight:600; margin:.24em 0 0; color:var(--lime); line-height:1.12; letter-spacing:-.04em }
.metric dd small { font-size:1rem; font-weight:400; letter-spacing:0; margin-left:.35em }
strong { font-weight:600 }
details { margin-top:8px; border:1px solid var(--border); border-radius:5px; overflow:hidden }
summary { cursor:pointer; padding:.65em .9em; background:#20322b }
summary small { margin-left:.55em; font-variant-numeric:tabular-nums }
details > h3 { margin:1em }
.scroll { overflow-x:auto }
table { border-collapse:collapse; width:100%; font-size:.92rem }
th, td { text-align:left; vertical-align:top; padding:.48em 1em; border-top:1px solid var(--border); overflow-wrap:anywhere }
th { font-weight:500 }
thead { color:var(--muted); background:#16251f }
.filter { margin:.6em 1em }
.changes-only tr.same, details:not(.changes-only) > .no-changes { display:none }
.no-changes { margin:.5em 1em }
.delta { margin-left:.4em; color:#a8cfeb; font-size:.9em; font-weight:600 }
.delta.Raised { color:var(--mint) }
.delta.Reduced { color:#f8c36e }
figure { margin:1em 0; padding:16px; border:1px solid var(--border); border-radius:5px; background:var(--ink) }
figure .switch { font-size:.88rem }
.plot-legend { display:flex; flex-wrap:wrap; align-items:center; gap:.25em 1.1em }
.series, .target-key { display:flex; align-items:center; gap:.45em }
.series::before, .target-key::before { content:""; flex:none; width:1.6em; border-top:2px solid var(--mint) }
.series.second::before { border-top:2px dashed #f8c36e }
.target-key::before { border-top:2px dashed var(--muted) }
figure svg { cursor:crosshair; touch-action:pan-y }
figure svg:focus-visible { outline:1px solid var(--lime) }
.frame-readout { margin-top:.8em; padding-top:.6em; border-top:1px solid var(--border); font-size:.9rem; font-variant-numeric:tabular-nums }
.frame-readout p { margin:.2em 0 }
svg polyline.second { stroke:#f8c36e; stroke-dasharray:6 4 }
svg .cursor { stroke:var(--paper); stroke-dasharray:2 3 }
svg circle { fill:var(--mint); stroke:var(--ink) }
svg circle.second { fill:#f8c36e }
svg { width:100%; display:block; margin:.5em 0; overflow:visible }
svg text { fill:var(--muted); font-size:13px }
svg line { stroke:var(--border) }
svg .target { stroke:var(--muted); stroke-dasharray:6 5 }
svg polyline { fill:none; stroke:var(--mint); stroke-width:1.6; vector-effect:non-scaling-stroke }
.route-axis { font-size:.85rem; color:var(--muted); text-align:center }
figcaption { margin-top:.6em; font-size:.92rem }
.files { list-style:none; padding:0 1em; line-height:1.8; overflow-wrap:anywhere }
.files a { color:var(--mint) }
@media (max-width:600px) {
  body { padding:0 10px 20px } main { padding:16px }
  .metrics { grid-template-columns:1fr }
  .metric { display:flex; align-items:baseline; justify-content:space-between; gap:8px }
  .metric dd { font-size:2.2rem; margin:0 }
  .brand { padding:14px 2px }
  figure { padding:8px }
}
</style>
</head>
<body>
<div class="brand"><img src="@@ENGINE_ICON@@" alt=""><b>Pepengine2</b> Benchmark results</div>
<main>
<!--BENCHMARK-->
</main>
<script>
"use strict";
const views = document.querySelectorAll("button[data-view]");
for (const tab of views) {
  tab.onclick = () => {
    for (const button of views) {
      const active = button === tab;
      button.setAttribute("aria-pressed", String(active));
      document.getElementById(button.dataset.view).hidden = !active;
    }
  };
}
document.querySelector('a[href="#sources"]').onclick = () => { document.getElementById("sources").open = true; };
document.title = document.querySelector("h1").textContent + " · Benchmark results · PEPEngine2";

document.querySelector('link[rel="icon"]').href = document.querySelector(".brand img").src;
for (const filter of document.querySelectorAll(".filter")) {
  const buttons = [...filter.querySelectorAll("button")];
  buttons.forEach((button, index) => button.onclick = () => {
    filter.closest("details").classList.toggle("changes-only", index === 0);
    buttons.forEach(b => b.setAttribute("aria-pressed", String(b === button)));
  });
}

for (const chart of document.querySelectorAll("figure[data-target]")) {
  const svg = chart.querySelector("svg");
  if (!svg) continue;
  const lines = [...chart.querySelectorAll(".series")].map(el => {
    const sections = [];
    const label = el.querySelector(".series-label");
    for (const section of el.querySelectorAll("[data-section]")) sections[Number(section.dataset.section)] = section.textContent;
    return {
      frames: el.dataset.frames.trim().split(/\s+/).map(row => row.split(",").map(Number)),
      trace: el.dataset.trace.trim().split(/\s+/).map(Number),
      role: el.classList.contains("second") ? "second" : "first",
      label, msCaption: label.textContent, sections
    };
  });
  const start = Math.min(...lines.map(l => l.frames[0][0]));
  const end = Math.max(...lines.map(l => l.frames.at(-1)[0]));
  const buttons = [...chart.querySelectorAll("button")];
  const readout = chart.querySelector(".frame-readout");
  const x = time => 54 + 730 * (time - start) / Math.max(.001, end - start);
  let fps = false, peak = 1, cursorTime = null, markers;
  const value = frame => fps ? 1000 / frame[1] : frame[1];
  const y = value => 164 - 150 * value / peak;
  function node(name, attrs, parent = svg) {
    const el = document.createElementNS("http://www.w3.org/2000/svg", name);
    for (const [key, val] of Object.entries(attrs)) el.setAttribute(key, val);
    parent.append(el);
    return el;
  }
  function nearest(frames, t) {
    let lo = 0, hi = frames.length - 1;
    while (lo < hi) {
      const mid = Math.floor((lo + hi) / 2);
      if (frames[mid][0] < t) lo = mid + 1; else hi = mid;
    }
    return lo && t - frames[lo - 1][0] < frames[lo][0] - t ? lo - 1 : lo;
  }
  function inspect(t) {
    cursorTime = Math.max(start, Math.min(end, t));
    markers.replaceChildren();
    node("line", {class:"cursor", x1:x(cursorTime), x2:x(cursorTime), y1:14, y2:164}, markers);
    readout.replaceChildren();
    for (const line of lines) {
      const row = document.createElement("p");
      const title = document.createElement("b");
      title.textContent = line.label.textContent;
      row.append(title);
      if (cursorTime < line.frames[0][0] || cursorTime > line.frames.at(-1)[0]) {
        row.append(" · Outside measured interval");
      } else {
        const frame = line.frames[nearest(line.frames, cursorTime)];
        const [time, interval, cpu, number, section] = frame;
        node("circle", {class:line.role, cx:x(time), cy:y(value(frame)), r:4}, markers);
        const details = ["Frame #" + number, time.toFixed(3) + " s", line.sections[section],
          fps ? "Frame rate " + value(frame).toFixed(1) + " FPS" : "Application frame interval " + interval.toFixed(3) + " ms"];
        if (cpu >= 0) details.push("Timed CPU scope " + cpu.toFixed(3) + " ms");
        row.append(" · " + details.filter(Boolean).join(" · "));
      }
      readout.append(row);
    }
  }
  function draw() {
    const limit = Number(chart.dataset.target);
    const target = limit && (fps ? limit : 1000 / limit);
    peak = target;
    for (const line of lines)
      for (const index of line.trace) peak = Math.max(peak, value(line.frames[index]));
    svg.replaceChildren();
    for (let i = 0; i <= 4; ++i) {
      const tick = peak * i / 4, time = start + (end - start) * i / 4;
      node("line", {x1:54, x2:784, y1:y(tick), y2:y(tick)});
      node("text", {x:46, y:y(tick) + 4, "text-anchor":"end"}).textContent = tick.toFixed(1);
      node("text", {x:x(time), y:187, "text-anchor":"middle"}).textContent = time.toFixed(1);
    }
    if (target) {
      node("line", {class:"target", x1:54, x2:784, y1:y(target), y2:y(target)});
      chart.querySelector(".target-key").textContent = "Target " + (fps ? limit + " FPS" : target.toFixed(1) + " ms");
    }
    for (const line of lines) {
      line.label.textContent = fps ? line.label.dataset.fps : line.msCaption;
      const points = line.trace.map(index => {
        const frame = line.frames[index];
        return x(frame[0]) + "," + y(value(frame));
      });
      node("polyline", {class:line.role, points:points.join(" ")});
    }
    markers = node("g", {});
    if (cursorTime !== null) inspect(cursorTime);
    buttons.forEach((button, i) => button.setAttribute("aria-pressed", String(Boolean(i) === fps)));
  }
  function pointer(event) {
    const point = new DOMPoint(event.clientX, event.clientY).matrixTransform(svg.getScreenCTM().inverse());
    inspect(start + (end - start) * (point.x - 54) / 730);
  }
  svg.onpointermove = pointer;
  svg.onpointerdown = pointer;
  // Advance at least one displayed frame, even when the pointer is between samples.
  svg.onkeydown = event => {
    if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
    event.preventDefault();
    if (event.key === "End") { inspect(end); return; }
    if (event.key === "Home" || cursorTime === null) { inspect(start); return; }
    const right = event.key === "ArrowRight";
    let next = right ? end : start;
    for (const {frames} of lines) {
      let i = nearest(frames, cursorTime) + (right ? 1 : -1);
      if (right && cursorTime < frames[0][0]) i = 0;
      if (!right && cursorTime > frames.at(-1)[0]) i = frames.length - 1;
      while (i >= 0 && i < frames.length && (right ? frames[i][0] <= cursorTime : frames[i][0] >= cursorTime))
        i += right ? 1 : -1;
      if (i >= 0 && i < frames.length) next = right ? Math.min(next, frames[i][0]) : Math.max(next, frames[i][0]);
    }
    inspect(next);
  };
  buttons.forEach((button, i) => button.onclick = () => { fps = Boolean(i); draw(); });
  draw();
}
</script>
</body>
</html>
