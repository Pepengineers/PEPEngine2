[ConsoleVariables]
Render.PrimaryAdapter = 0
Render.NumFrames = 3
Render.Queues.AsyncEnabled = true
; Runtime DXC shaders. Set to 0 and restart Bistro to debug without optimization.
Render.Shaders.Optimize = 1
App.RenderInBackground = true

Render.Sky.Source = 2
Render.Sky.SunCycle.Enabled = true
Render.Sky.SunCycle.PeriodSeconds = 120
; Camera SkyView LUT on the selected secondary GPU. -1 keeps it local.
Render.Sky.SkyView.Adapter = -1
; 1 = current. 0 = exact previous with current bootstrap. 3 = latest completed with local bootstrap.
Render.Sky.SkyView.CrossSync = 1
; Aerial radiance and transmittance for the active camera. -1 keeps them local.
Render.Sky.AerialPerspective.Adapter = -1
; 1 = import the matching pair for the current camera.
Render.Sky.AerialPerspective.CrossSync = 1
Render.Sky.Atmosphere.Enabled = true
Render.Sky.Atmosphere.Quality = 2
Render.Sky.SkyBox.Enabled = true
Render.Sky.SkyBox.Quality = 2
Render.Sky.Clouds.Quality = 2
Render.Sky.AsyncCompute = false

Render.ReflectionProbes.Quality = 2

Render.Water.Enabled = true
Render.Water.Quality = 2
Render.Water.Count = 1
Render.Water.ParticleCount = 100000
Render.Water.PresetParticleCount = 0
Render.Water.HeightScale = 2
Render.Water.WaveSpeed = 6
Render.Water.WaveAcceleration = 4
Render.Water.WavePeriod = 6
Render.Water.ParticleRadius = 0.15
; -1 keeps SPH on GPU0. A secondary DXGI index offloads SPH and imports the packed display.
Render.Water.Adapter = -1
; 0 = exact previous, with current-frame bootstrap. 1 = exact current.
; 2 = independent GPU1, newest completed snapshot. First visible frame can wait for its export.
Render.Water.CrossSync = 0
Render.Water.AsyncCompute = false

Render.Particles.Enabled = true
Render.Particles.DrawEnabled = true
Render.Particles.SimulationEnabled = true
Render.Particles.Quality = 2
Render.Particles.Count = -1
Render.Particles.CountScale = 2
Render.Particles.EdgeSamples = 1
Render.Particles.MinPixelSize = 0
; -1 leaves marked particle simulation on GPU0. Use a secondary DXGI adapter index for MGPU.
Render.Particles.Adapter = -1
; 1 imports the current step, 0 imports the preceding step after a current-step bootstrap.
; 3 orders one step per frame, 2 runs GPU1 independently. Both show the newest completed snapshot
; and start with an empty remote source until the first export completes.
Render.Particles.CrossSync = 1
Render.Particles.AsyncCompute = false

Render.Grass.Enabled = true
Render.Grass.Quality = 2
Render.Grass.Count = 1
Render.Grass.Implementation = 0

Render.Wind.Enabled = true
Render.Wind.Quality = 2
Render.Wind.Algorithm = 0
; -1 runs wind locally. Select a hardware GPU for ProjectedGrid (Algorithm=1).
Render.Wind.Adapter = -1
; 1 imports the exact current wind publication. 0 imports the exact previous one after a current-frame bootstrap.
Render.Wind.CrossSync = 1
; Evaluate Linden fragments on the ProjectedGrid GPU. Vertex deformation stays on the primary GPU.
Render.Wind.LindenResponseOnSecondary = false

Render.Tree.Quality = 1

Render.Shadows.Sun.Resolution = 2048
Render.Shadows.Local.Resolution = 256

Render.Skinning.Instancing = true
Render.Skinning.Enabled = true
Render.Skinning.Quality = 2
Render.Skinning.PoseRateHz = 0

App.NPC.Count = 10
App.NPC.PresetCount = -1

App.Fox.Count = 5
App.Fox.PresetCount = -1

Render.AO.Enabled = true
Render.AO.Implementation = 2
Render.AO.Quality = 2
Render.AO.Resolution = 0
Render.AO.ExecutionPoint = 1
Render.AO.RadiusCm = 50
Render.AO.Intensity = 1
Render.AO.DenoisePasses = -1
; -1 uses local AO. A secondary DXGI index offloads SSAO/CACAO (full or half), HBAO (half), or XeGTAO (full).
Render.AO.Adapter = -1
; 1 = current frame. 0 = import exactly the previous frame and reproject it. Bootstrap uses the current frame.
Render.AO.CrossSync = 1
; 1 filters remote SSAO/HBAO/XeGTAO on GPU1, 0 filters on GPU0. CACAO follows its SDK context.
Render.AO.BlurOnSecondary = 0
Render.AO.AsyncCompute = false

; Hardware adapter for Bistro transparency. -1 keeps drawing on the primary adapter.
Render.WBOIT.Adapter = -1

; -1 builds the local-light grid on the scene GPU. A secondary DXGI index exports this frame's masks.
Render.LightGrid.Adapter = -1
Render.LightGrid.AsyncCompute = false

Render.SSR.Enabled = true
Render.SSR.Quality = 2

Render.DOF.Enabled = true
Render.DOF.Quality = 2
Render.DOF.FocusDistanceCm = 500
Render.DOF.FNumber = 2.8
Render.DOF.SensorHeightMm = 24
Render.DOF.CocLimit = 0
Render.DOF.Rings = 0
Render.DOF.RingMerge = true

App.UI.WorldCanvas.Quality = 1
; -1 follows the primary GPU. Remote display: 1 = current, 0 = previous after first frame.
App.UI.WorldCanvas.Atrium.Adapter = -1
App.UI.WorldCanvas.Atrium.CrossSync = 1
App.UI.WorldCanvas.Terrace.Adapter = -1
App.UI.WorldCanvas.Terrace.CrossSync = 1

App.UI.CloudPicture.Enabled = true
App.UI.CloudPicture.Width = 1024
App.UI.CloudPicture.Height = 512
App.UI.CloudPicture.Adapter = -1
; 0 = exact previous, with current-frame bootstrap. 1 = exact current.
; 2 = independent GPU1, newest completed export. First frame can wait for its export.
App.UI.CloudPicture.CrossSync = 0
App.UI.CloudPicture.SpeedScale = 4
App.UI.CloudPicture.AsyncCompute = false

App.UI.GameHUD.Quality = 1
; -1 draws the game HUD on the primary GPU. A secondary DXGI index exports one finished HUD layer.
App.UI.GameHUD.Adapter = -1

; -1 keeps Bistro postprocessing and presentation on the scene adapter.
Render.Post.Adapter = -1

Render.MotionBlur.Enabled = true
Render.MotionBlur.Quality = 2
Render.MotionBlur.ShutterFraction = 0.5
Render.MotionBlur.MaxRadius = 40
Render.MotionBlur.Samples = 0

Render.Upscaler.Provider = 5
; Balanced is the middle TAAU scaling preset.
Render.Upscaler.Quality = 3

Render.FrameGeneration.Provider = 0

App.Benchmark.WarmupSeconds = 3
App.Benchmark.PaintingHoldSeconds = 5
App.Benchmark.AutoStart = false
App.Benchmark.SkipBenchmark = false

; 1 publishes camera depth and material normals before the first G-buffer draw.
Render.DepthNormals.PrepassEnabled = true

; Original interior props only; category changes require restarting Bistro.
App.Physics.Categorized = true
App.Physics.Quality = 2
App.Physics.SimulationEnabled = true
App.Physics.CountScale = 1
App.Physics.GlassOpacity = 0.85
