[ConsoleVariables]
; CPU frustum light grid (startup only).
Render.Lighting.Cluster.TileSize = 64
Render.Lighting.Cluster.DepthSlices = 32
Render.Lighting.Cluster.FarDepthCm = 100000
App.RenderInBackground = 1
; Taller splashes above the street pool rim; preserves the basin floor (startup only, 1..3).
App.Water.HeightScale = 2
; Optional secondary fluid solver. Route changes take effect at the next simulation epoch.
Render.Fluid.MultiGPU = false
Render.Fluid.MultiGPU.Exact = false
Render.Fluid.MultiGPU.UpdateHz = 0
Render.Fluid.MultiGPU.MaxAgeMs = 0
; Optional secondary interaction and wind fields. Exact waits on the requested version.
Render.Grass.MultiGPU = false
Render.Grass.MultiGPU.Exact = false
Render.Grass.MultiGPU.UpdateHz = 0
Render.Grass.MultiGPU.MaxAgeMs = 0
; Optional procedural Bistro environment and its placement.
Render.Clouds.Bistro = false
Render.Clouds.AsyncCompute = false
Render.Clouds.MultiGPU = false
Render.Clouds.Latest = true
Render.Clouds.UpdateHz = 0
Render.Clouds.MaxAgeMs = 0
Render.NumFrames = 3
; Master adapter runtime switch. Zero selects the first usable secondary adapter.
Render.MGPU.Enabled = false
Render.MGPU.SecondaryLuid = 0
; Optional secondary UI, scoped to the screen and both world canvases (0), or one CanvasId (1).
Render.UI.Offload = false
Render.UI.AsyncCompute = false
Render.UI.Quality = 0
Render.UI.OffloadScope = 0
Render.UI.CanvasId = 0
; 0 = Exact, 1 = Latest for world canvases. The screen always uses Exact.
Render.UI.Freshness = 0
Render.UI.UpdateHz = 0
Render.UI.MaxAgeMs = 0
; Exact secondary shadows. Scope 0 all, 1 sun, 2 local lights, 3 one ECS entity slot.
Render.Shadows.MultiGPU = false
Render.Shadows.MultiGPU.Selection = 0
Render.Shadows.MultiGPU.Entity = 0
Jobs.ThreadCount = 0
Jobs.BatchSize = 64
Loading.TransientBudgetMiB = 1024
; Runtime AO. Sample/denoise overrides use -1 to inherit Quality.
Render.AO.ExecutionPoint = 1
; 0 = full scene render grid, 1 = half-resolution AO with full-grid visibility output.
Render.AO.Resolution = 0
; Exact current-frame AO on the secondary adapter when Render.MGPU.Enabled is active.
Render.AO.MultiGPU = false
Render.AO.Enabled = 1
Render.AO.Quality = 2
Render.AO.Implementation = 2
Render.AO.RadiusCm = 50
Render.AO.Intensity = 1
Render.AO.DenoisePasses = -1
Render.AO.Sharpness = 0.98
Render.AO.FadeStartCm = 5000
Render.AO.FadeEndCm = 15000
Render.AO.HorizonBias = 0.06
Render.AO.SSAO.Samples = -1
Render.AO.SSAO.BiasCm = 0.5
Render.AO.HBAO.Directions = -1
Render.AO.HBAO.Steps = -1
Render.AO.XeGTAO.Slices = -1
Render.AO.XeGTAO.Steps = -1
Render.AO.XeGTAO.Falloff = 0.615
Render.AO.XeGTAO.ThinOccluder = 0
Render.AO.CACAO.Quality = -1
Render.AO.CACAO.Power = 1.5
Render.AO.CACAO.Clamp = 0.98
Render.AO.CACAO.Detail = 0.5
Render.AO.CACAO.AdaptiveLimit = 0.45

; Capture parameters belong to each ReflectionProbeComponent.
Render.Reflection.Enabled = true
Render.Reflection.Quality = 2

; AMD FidelityFX SSSR + Reflections Denoiser. All values are runtime writable.
Render.SSR.Enabled = true
Render.SSR.Quality = 2
; -1 inherits Low/Mid/High without losing explicit overrides.
Render.SSR.MaxIntersections = -1
Render.SSR.MinOccupancy = -1
Render.SSR.MostDetailedMip = -1
Render.SSR.SamplesPerQuad = -1
Render.SSR.VarianceGuided = true
Render.SSR.RoughnessCutoff = -1
Render.SSR.Thickness = 8
Render.SSR.TemporalStability = -1
Render.SSR.VarianceThreshold = 0.05

; FidelityFX DoF: 0 Off, 1 Low, 2 Mid, 3 High. Overrides use 0 to inherit the preset.
Render.DOF.Enabled = true
Render.DOF.Quality = 2
Render.DOF.FocusDistanceCm = 500
Render.DOF.FNumber = 2.8
Render.DOF.SensorHeightMm = 24
Render.DOF.CocLimit = 0
Render.DOF.Rings = 0
Render.DOF.RingMerge = true
Render.MotionBlur.Enabled = true
Render.MotionBlur.Quality = 2
Render.MotionBlur.ShutterFraction = 0.5
Render.MotionBlur.MaxRadius = 40
Render.MotionBlur.Samples = 0
Render.MotionBlur.CenterWeight = 40
Render.MotionBlur.VelocityThreshold = 1.5

; Sky source/assets/physical parameters/budgets belong to the selected world component.
Render.SkyBox.Enabled = true
Render.SkyBox.Quality = 3
Render.SkyAtmosphere.Enabled = true
Render.SkyAtmosphere.Quality = 2
; GPU emitter simulation, materials and budgets belong to ParticleEmitterComponent.
Render.Particles.Enabled = true
Render.Particles.DrawEnabled = true
Render.Particles.SimulationEnabled = true
Render.Particles.AsyncCompute = false
Render.Particles.Quality = 2
; Skeletal playback/source/material/pose/rate overrides belong to each render component.
Render.Skinning.Enabled = true
Render.Skinning.Quality = 2
; Only explicitly selected procedural cloud components; no scene installation.
Render.Clouds.Enabled = true
Render.Clouds.Quality = 2
