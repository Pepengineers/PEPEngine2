[ConsoleVariables]
Render.NumFrames = 3
Jobs.ThreadCount = 0
Jobs.BatchSize = 64
Loading.TransientBudgetMiB = 1024

; AO implementation: 0 SSAO, 1 HBAO, 2 XeGTAO. Quality: 0 Off, 1 Low, 2 Mid, 3 High.
Render.AO.Enabled = true
Render.AO.Quality = 2
Render.AO.Implementation = 2
Render.AO.Radius = 100
Render.AO.Intensity = 1
Render.AO.Bias = 0.02
; -1 keeps the quality preset; explicit values remain when quality changes.
Render.AO.Samples = -1
Render.AO.DenoisePasses = -1

; FidelityFX SSSR. Quality: 0 Off, 1 Low, 2 Mid, 3 High.
Render.SSR.Enabled = true
Render.SSR.Quality = 2
Render.SSR.Thickness = 0.1
Render.SSR.RoughnessThreshold = 0.8
Render.SSR.MaxTraversalSteps = -1
Render.SSR.TemporalStability = 0.9
Render.SSR.SamplesPerQuad = -1

Render.MotionBlur.Enabled = false
Render.MotionBlur.Quality = 2
Render.MotionBlur.ShutterAngle = 180
Render.MotionBlur.MaxRadius = 32
Render.MotionBlur.Samples = -1

Render.DOF.Enabled = false
Render.DOF.Quality = 2
Render.DOF.FocusDistance = 1000
Render.DOF.Aperture = 2.8
Render.DOF.MaxCoC = -1

; Local probes are components; the default scene has none.
Render.Reflection.Enabled = true
Render.Reflection.Quality = 2
Render.Reflection.Implementation = 0
Render.Reflection.Resolution = -1
Render.Reflection.FacesPerFrame = -1

; One selected component supplies both sky and global IBL. The existing Sun owns SkyBox.
Render.Sky.Source = 1
Render.SkyBox.Enabled = true
Render.SkyBox.Quality = 2
Render.SkyBox.Intensity = 1
Render.SkyBox.Rotation = 0
Render.SkyAtmosphere.Enabled = true
Render.SkyAtmosphere.Quality = 2
Render.SkyAtmosphere.RayleighScale = 1
Render.SkyAtmosphere.MieScale = 1
Render.SkyAtmosphere.OzoneScale = 1
Render.SkyAtmosphere.MultipleScattering = 1
Render.SkyAtmosphere.SunIntensity = 1
Render.SkyAtmosphere.MieAnisotropy = 0.8
Render.SkyAtmosphere.AerialPerspective = true
Render.SkyAtmosphere.AerialDistanceKm = 32

; Grass/Wind affect components only; Bistro contains neither.
Render.Grass.Enabled = true
Render.Grass.Quality = 2
Render.Grass.DensityScale = 1
Render.Grass.HeightScale = 1
Render.Grass.BendScale = 1
Render.Grass.LodScale = 1
Render.Wind.Enabled = true
Render.Wind.Quality = 2
Render.Wind.ForceScale = 1
Render.Wind.DirectionOffset = 0
Render.Wind.GridResolution = -1
Render.Wind.PressureIterations = -1
